<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MFBP</title>
<style>
  :root {
    --bg: #0B1220;
    --gold: #D4A94F;
    --lime: #C4E15A;
    --text-dim: #9AA5B8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: #EDEFF4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center;
    padding: 24px;
  }
  h1 {
    font-size: clamp(2.5rem, 8vw, 4rem);
    font-weight: 800;
    letter-spacing: 0.02em;
    color: var(--gold);
    margin: 0;
  }
  .tagline {
    color: var(--lime);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 8px 0 32px;
  }
  p { color: var(--text-dim); max-width: 40ch; }
  a { color: var(--gold); }
</style>
</head>
<body>
  <h1>MFBP</h1>
  <div class="tagline">Move Fast, Be Patient</div>
  <p>Launching soon on the App Store. In the meantime, see the <a href="/privacy">privacy policy</a>.</p>
</body>
</html>
