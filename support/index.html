<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — MFBP</title>
<style>
  :root { --bg: #0B1220; --surface: #131B2E; --border: #26324D; --text: #EDEFF4; --text-dim: #9AA5B8; --gold: #D4A94F; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 56px 24px 96px; }
  h1 { font-size: 2rem; margin: 0 0 4px; }
  .meta { color: var(--text-dim); font-size: .9rem; margin-bottom: 32px; }
  a { color: var(--gold); }
  .app { display: flex; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 14px; text-decoration: none; color: var(--text); }
  .app img { width: 56px; height: 56px; border-radius: 13px; flex: 0 0 auto; }
  .app strong { display: block; }
  .app span { color: var(--text-dim); font-size: .95rem; }
  footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--text-dim); font-size: .85rem; }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Support</h1>
  <div class="meta">Pick your app for answers to common questions. Or email <a href="mailto:support@mfbp.io">support@mfbp.io</a>.</div>
  <a class="app" href="/wellness/support/">
    <img src="/img/icon.png" alt="">
    <div><strong>MFBP</strong><span>Train, Fuel and Mind</span></div>
  </a>
  <a class="app" href="/getitdone/support/">
    <img src="/img/getitdone-icon.png" alt="">
    <div><strong>MFBP Chores: Get It Done</strong><span>Family chores and allowance</span></div>
  </a>
  <footer><a href="/">MFBP — Move fast.</a></footer>
</div>
</body>
</html>
